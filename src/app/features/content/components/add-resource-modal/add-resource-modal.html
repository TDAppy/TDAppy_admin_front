<div
  class="modal-overlay"
  role="button"
  tabindex="0"
  (click)="onOverlayClick($event)"
  (keydown.escape)="closeModal.emit()">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Ajouter une ressource</h2>
      <button type="button" class="btn-close" (click)="closeModal.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="title">Titre *</label>
        <input id="title" type="text" [value]="title()" (input)="title.set($any($event.target).value)" />
      </div>

      <div class="field">
        <label for="content">Contenu *</label>
        <textarea id="content" rows="4" [value]="content()" (input)="content.set($any($event.target).value)"></textarea>
      </div>

      <div class="field">
        <label for="urlImage">Image</label>
        <input id="urlImage" type="file" accept=".jpg,.jpeg,.png,.webp" (change)="onFileSelected($event)" />
      </div>

      <div class="field">
        <label for="type">Type *</label>
        <select id="type" [value]="type()" (change)="type.set($any($event.target).value)">
          <option value="">Sélectionner un type</option>
          @for (t of types; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" rows="3" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
      </div>

      <div class="field">
        <label for="reference">Référence</label>
        <input id="reference" type="text" [value]="reference()" (input)="reference.set($any($event.target).value)" />
      </div>

      <div class="field">
        <label for="theme">Thème *</label>
        <select id="theme" [value]="theme()" (change)="theme.set($any($event.target).value)">
          <option value="">Sélectionner un thème</option>
          @for (th of themes; track th) {
            <option [value]="th">{{ th }}</option>
          }
        </select>
      </div>

      @if (error()) {
        <p class="error-message">{{ error() }}</p>
      }
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal.emit()">Annuler</button>
      <button type="button" class="btn-confirm" (click)="submit()">Ajouter</button>
    </div>
  </div>
</div>
