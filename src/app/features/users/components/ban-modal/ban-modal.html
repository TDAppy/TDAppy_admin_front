<div role="button" tabindex="0" class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Bannir {{ username() }}</h2>
      <button type="button" class="btn-close" (click)="closeModal.emit()">✕</button>
    </div>

    <div class="modal-body">
      <label class="checkbox-label">
        <input type="checkbox" [checked]="isPermanent()" (change)="togglePermanent()" />
        Ban permanent
      </label>

      @if (!isPermanent()) {
        <div class="field">
          <label for="bannedUntil">Date de fin du ban</label>
          <input
            id="bannedUntil"
            type="datetime-local"
            [value]="bannedUntil()"
            (change)="bannedUntil.set($any($event.target).value)" />
        </div>
      }
    </div>
    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal.emit()">Annuler</button>
      <button type="button" class="btn-confirm" (click)="submit()">Confirmer</button>
    </div>
  </div>
</div>
