<h1>Liste des utilisateurs</h1>

<div class="admin-table-container">
  <app-admin-table
    [columns]="columns"
    [data]="data()"
    [actions]="actions"
    [disabledKeysFn]="disabledKeysFn"
    (actionTrigerred)="onActionTriggered($event)"
  />
</div>

<app-pagination
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  [totalItems]="totalItems()"
  (pageChange)="goToPage($event)"
/>

@if (showBanModal() && selectedUser()) {
  <app-ban-modal
    [username]="selectedUser()!.username"
    (closeModal)="showBanModal.set(false)"
    (confirm)="onBanConfirmed($event)"
  />
}

@if (showDeleteModal() && selectedUser()) {
  <app-confirm-delete-modal
    title="Supprimer l'utilisateur"
    [description]="'Voulez-vous vraiment supprimer ' + selectedUser()!.username + ' ?'"
    (closeModal)="showDeleteModal.set(false)"
    (confirm)="onDeleteConfirmed()"
  />
}
