<div role="button" tabindex="0" class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Modifier le topic</h2>
      <button type="button" class="btn-close" (click)="closeModal.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label for="title">Titre</label>
        <input type="text" [value]="title()" (input)="title.set($any($event.target).value)" id="title" />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea rows="6" [value]="message()" (input)="message.set($any($event.target).value)" id="message"></textarea>
      </div>

      <div class="field">
        <label for="categoryName">Catégorie</label>
        <select [value]="categoryName()" (change)="categoryName.set($any($event.target).value)" id="categoryName">
          <option value="">Sélectionner une catégorie</option>
          @for (cat of categories(); track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      @if (error()) {
        <p class="error-message">{{ error() }}</p>
      }
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal.emit()">Annuler</button>
      <button type="button" class="btn-confirm" (click)="submit()">Confirmer</button>
    </div>
  </div>
</div>
